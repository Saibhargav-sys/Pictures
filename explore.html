<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#fafaf8">
    <meta name="description" content="Explore the Stillframe photo collection.">
    <title>Stillframe — Explore</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="index.html">Stillframe</a>
      <nav aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="explore.html" aria-current="page">Explore</a>
      </nav>
    </header>
    <main>
      <section class="gallery-section">
        <h1>Explore</h1>
        <form id="upload-form" class="upload-form">
          <button id="choose-photo" class="upload-button" type="button">Choose photo</button>
          <input id="photo-file" type="file" accept="image/jpeg,image/png,image/webp" hidden>
          <span id="selected-file" class="selected-file"></span>
          <div id="turnstile-widget"></div>
          <button id="submit-upload" class="upload-button" type="submit" hidden disabled>Upload</button>
          <p id="upload-status" class="upload-status" role="status" aria-live="polite"></p>
        </form>
        <p class="upload-note">Uploads are public · JPG, PNG, or WebP · 10 MB max</p>
        <div id="photo-grid" class="photo-grid" aria-live="polite" aria-busy="true"></div>
      </section>
    </main>
    <dialog id="lightbox" aria-label="Photo viewer">
      <div class="viewer">
        <button id="close-viewer" class="close-viewer" aria-label="Close viewer">×</button>
        <button id="prev-photo" class="viewer-arrow prev" aria-label="Previous photo">‹</button>
        <img id="viewer-image" alt="">
        <button id="next-photo" class="viewer-arrow next" aria-label="Next photo">›</button>
        <div class="viewer-caption">
          <span id="viewer-title"></span>
          <span id="viewer-index"></span>
        </div>
      </div>
    </dialog>
    <script src="upload-config.js"></script>
    <script src="script.js" defer></script>
    <script src="upload.js"></script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onStillframeTurnstileLoad&render=explicit" async defer></script>
  </body>
</html>
