<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#fafaf8">
    <meta name="description" content="Spotlight photographs and a growing photo collection.">
    <title>Stillframe — Photos</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#home">Stillframe</a>
      <nav aria-label="Main navigation">
        <a href="#home">Home</a>
        <a href="#explore">Explore</a>
      </nav>
    </header>
    <main>
      <section id="home" class="gallery-section">
        <h1>Spotlight</h1>
        <div id="spotlight-grid" class="photo-grid" aria-live="polite" aria-busy="true"></div>
      </section>
      <section id="explore" class="gallery-section">
        <h2>Explore</h2>
        <div id="photo-grid" class="photo-grid" aria-live="polite" aria-busy="true"></div>
      </section>
    </main>
    <dialog id="lightbox" aria-label="Photo viewer">
      <div class="viewer">
        <button id="close-viewer" class="close-viewer" aria-label="Close viewer">×</button>
        <button id="prev-photo" class="viewer-arrow prev" aria-label="Previous photo">‹</button>
        <img id="viewer-image" alt="">
        <button id="next-photo" class="viewer-arrow next" aria-label="Next photo">›</button>
        <div class="viewer-caption">
          <span id="viewer-title"></span>
          <span id="viewer-index"></span>
        </div>
      </div>
    </dialog>
    <script src="script.js" defer></script>
  </body>
</html>
